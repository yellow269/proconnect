plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.proconect.app'
    compileSdk 34

    defaultConfig {
        applicationId "za.co.proconect.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def keystorePath = rootProject.file('release-key.jks')
            def ksPassword = System.getenv('KEYSTORE_PASSWORD')
            if (keystorePath.exists() && ksPassword) {
                storeFile keystorePath
                storePassword ksPassword
                keyAlias 'proconnect'
                keyPassword System.getenv('KEY_PASSWORD') ?: ksPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.browser:browser:1.6.0'
    implementation 'com.google.android.material:material:1.11.0'
}

def proguardRules = file('proguard-rules.pro')
if (!proguardRules.exists()) {
    proguardRules.text = '''
-keep class za.co.proconect.app.** { *; }
-keep class com.google.androidbrowserhelper.** { *; }
'''
}
