plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.proconect.app'
    compileSdk 33

    defaultConfig {
        applicationId "za.co.proconect.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def keystorePath = rootProject.file('release-key.jks')
            if (keystorePath.exists()) {
                storeFile keystorePath
                storePassword System.console()?.readLine("Keystore password: ") ?: ''
                keyAlias 'proconnect'
                keyPassword System.console()?.readLine("Key password: ") ?: ''
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:android-browser-helper:2.4.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}

def proguardRules = file('proguard-rules.pro')
if (!proguardRules.exists()) {
    proguardRules.text = '''
-keep class za.co.proconect.app.** { *; }
-keep class com.google.androidbrowserhelper.** { *; }
'''
}
